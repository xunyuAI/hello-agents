<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none">
  <rect width="960" height="420" fill="#0a1520"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="rgba(56,189,248,0.16)" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8a84a" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#g)"/>
  <ellipse cx="720" cy="70" rx="300" ry="150" fill="url(#glow)"/>

  <!-- Four layer stack -->
  <g font-family="Oxanium, sans-serif">
    <rect x="56" y="56" width="420" height="52" fill="#0f1e2c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="72" y="78" fill="#7dd3fc" font-size="13" letter-spacing="2">FRONTEND</text>
    <text x="72" y="96" fill="#9aafb8" font-size="12">Vue3 + TypeScript · Map · Form</text>

    <rect x="56" y="118" width="420" height="52" fill="#0f1e2c" stroke="#3da8b8" stroke-width="1.5"/>
    <text x="72" y="140" fill="#5ed4e0" font-size="13" letter-spacing="2">BACKEND</text>
    <text x="72" y="158" fill="#9aafb8" font-size="12">FastAPI · Pydantic · Routes</text>

    <rect x="56" y="180" width="420" height="52" fill="#0f1e2c" stroke="#e8a84a" stroke-width="1.5"/>
    <text x="72" y="202" fill="#e8a84a" font-size="13" letter-spacing="2">AGENTS</text>
    <text x="72" y="220" fill="#9aafb8" font-size="12">Attraction · Weather · Hotel · Planner</text>

    <rect x="56" y="242" width="420" height="52" fill="#0f1e2c" stroke="#6bc89a" stroke-width="1.5"/>
    <text x="72" y="264" fill="#6bc89a" font-size="13" letter-spacing="2">EXTERNAL</text>
    <text x="72" y="282" fill="#9aafb8" font-size="12">Amap MCP · Unsplash · LLM</text>
  </g>

  <!-- Agent pills -->
  <g font-family="Oxanium, sans-serif">
    <text x="560" y="120" fill="#7dd3fc" font-size="12" letter-spacing="3">MULTI-AGENT PIPELINE</text>
    <rect x="560" y="140" width="110" height="36" fill="#152636" stroke="#38bdf8"/>
    <text x="578" y="162" fill="#e6ede9" font-size="12">ATTRACTION</text>
    <path d="M678 158h18" stroke="#e8a84a" stroke-width="2"/>
    <rect x="700" y="140" width="90" height="36" fill="#152636" stroke="#e8a84a"/>
    <text x="718" y="162" fill="#e6ede9" font-size="12">WEATHER</text>
    <path d="M798 158h18" stroke="#e8a84a" stroke-width="2"/>
    <rect x="560" y="196" width="90" height="36" fill="#152636" stroke="#3da8b8"/>
    <text x="582" y="218" fill="#e6ede9" font-size="12">HOTEL</text>
    <path d="M658 214h18" stroke="#e8a84a" stroke-width="2"/>
    <rect x="680" y="196" width="110" height="36" fill="#152636" stroke="#6bc89a"/>
    <text x="702" y="218" fill="#e6ede9" font-size="12">PLANNER</text>
  </g>

  <g font-family="Oxanium, sans-serif">
    <circle cx="820" cy="320" r="68" fill="#152636" stroke="#38bdf8" stroke-width="2"/>
    <text x="786" y="310" fill="#7dd3fc" font-size="13" letter-spacing="2">LAB 13</text>
    <text x="772" y="332" fill="#e6ede9" font-size="14" letter-spacing="1">TRIP</text>
    <text x="758" y="352" fill="#9aafb8" font-size="11">ASSISTANT</text>
  </g>

  <text x="56" y="380" fill="#6d8490" font-family="Oxanium, sans-serif" font-size="12" letter-spacing="2">HELLO-AGENTS  ·  INDUSTRIAL BLUEPRINT LAB</text>
</svg>
