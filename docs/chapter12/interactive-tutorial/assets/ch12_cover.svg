    <rect x="64" y="78" width="520" height="36" fill="#152636" stroke="rgba(77,163,255,0.35)"/>
    <rect x="64" y="78" width="468" height="36" fill="rgba(77,163,255,0.55)"/>
    <text x="76" y="101" fill="#0a1520" font-size="13" font-weight="600">BFCL  AST MATCH  90%</text>

    <rect x="64" y="128" width="520" height="36" fill="#152636" stroke="rgba(61,168,184,0.35)"/>
    <rect x="64" y="128" width="364" height="36" fill="rgba(61,168,184,0.5)"/>
